# Miniflux, Maniflux and ig2rss. Passwords and settings come from the .env file next to this one.
# COMPOSE_PROFILES in .env picks what runs here:
#   reader  = Miniflux + Postgres + Maniflux (the personal server)
#   ig2rss  = ig2rss (the Mac)
# See server/README.md.

name: feed

services:
  miniflux:
    image: miniflux/miniflux:latest
    profiles: [reader]
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://miniflux:${POSTGRES_PASSWORD}@db/miniflux?sslmode=disable
      RUN_MIGRATIONS: "1"
      CREATE_ADMIN: "1"
      # The address you open Miniflux at
      BASE_URL: ${MINIFLUX_BASE_URL:-http://127.0.0.1:8080/}
      ADMIN_USERNAME: ${MINIFLUX_ADMIN_USER}
      ADMIN_PASSWORD: ${MINIFLUX_ADMIN_PASSWORD}
      # For later: lets Miniflux fetch feeds from services on this Mac (e.g. RSSHub)
      FETCHER_ALLOW_PRIVATE_NETWORKS: "1"
      # For later: lets Miniflux send its save webhook to the save-to-Obsidian receiver on this Mac
      INTEGRATION_ALLOW_PRIVATE_NETWORKS: "1"
      # Video length for new YouTube entries (one page fetch per new video), used by Maniflux's time budget
      FETCH_YOUTUBE_WATCH_TIME: "1"

  # Maniflux: ranks unread entries and saves to Obsidian. Open http://127.0.0.1:8090
  maniflux:
    build: ./maniflux
    profiles: [reader]
    restart: unless-stopped
    ports:
      - "127.0.0.1:8090:8090"
    depends_on:
      - miniflux
    environment:
      MINIFLUX_URL: http://miniflux:8080/v1
      MINIFLUX_API_KEY: ${MINIFLUX_API_KEY}
      # Writes each saved note's type and description
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-anthropic/claude-haiku-5.5}
      DIGEST_MODEL: ${DIGEST_MODEL:-anthropic/claude-sonnet-5.5}
      TZ: ${TZ:-America/Los_Angeles}
      # The address you open Maniflux at (used in the digest feed's links)
      PUBLIC_URL: ${MANIFLUX_PUBLIC_URL:-http://127.0.0.1:8090}
    volumes:
      - ${VAULT_CONTENT_PATH}:/vault/content
      - maniflux-data:/data

  # ig2rss: one RSS feed per Instagram account, for Miniflux. Status page: http://127.0.0.1:8091
  # Runs on the Mac; Miniflux on the server reaches it over Tailscale. See ig2rss/README.md.
  ig2rss:
    build: ./ig2rss
    profiles: [ig2rss]
    restart: unless-stopped
    ports:
      - "127.0.0.1:8091:8091"
    environment:
      IG2RSS_LOGIN: ${IG2RSS_LOGIN:-}
      IG2RSS_POLL_HOURS: ${IG2RSS_POLL_HOURS:-6}
      IG2RSS_REELS: ${IG2RSS_REELS:-0}
      IG2RSS_FEED_BASE_URL: ${IG2RSS_FEED_BASE_URL:-http://ig2rss:8091}
      TZ: ${TZ:-America/Los_Angeles}
    # Look up names directly, so the Mac's hosts-file block on Instagram doesn't apply to ig2rss
    dns:
      - 1.1.1.1
    volumes:
      # Accounts, cached posts and the Instagram session file
      - ig2rss-data:/data

  db:
    image: postgres:17-alpine
    profiles: [reader]
    restart: unless-stopped
    environment:
      POSTGRES_USER: miniflux
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: miniflux
    volumes:
      - miniflux-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "miniflux"]
      interval: 10s
      start_period: 30s

volumes:
  miniflux-db:
  maniflux-data:
  ig2rss-data:
